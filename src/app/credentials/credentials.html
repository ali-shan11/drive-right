<div class="credentaisla-wrapper p-4">
  <!--My Credentials-->
  <div class="my-credentials flex justify-between items-center pt-6">
    <!--Title / Subtitle-->
    <div class="title-subtitle flex flex-col justify-baseline gap-1">
      <h2 class="text-3xl text-start text-(--color-text) font-semibold">My Credentials</h2>
      <span class="font-normal text-base text-(--color-text)"
        >Manage your pass keys, certificates, and synced licenses.</span
      >
    </div>
    <!--Verify Certificate Button-->
    <div class="button">
      <button class="btn btn__glass p-4 flex items-center gap-1">
        <img class="w-4 h-4" src="images/icons/verify-certificate.svg" alt="certificate" />
        <span class="font-semibold text-sm text-(--color-text)">Verify a Certificate</span>
      </button>
    </div>
  </div>

  <!--Tab List-->
  <!--Tab-->
  <div class="w-full flex flex-col py-3">
    <div class="flex items-center gap-1">
      @for (tab of tabs; track $index) {
        <button
          (click)="activeTab = tab.id"
          class="flex items-center gap-2! px-4! py-3! text-sm font-medium text-white border-b-2 cursor-pointer whitespace-nowrap transition-all duration-200"
          [ngStyle]="
            activeTab === tab.id
              ? { color: 'var(--color-primary)', borderColor: 'var(--color-primary)' }
              : { color: 'var(--color-text)', borderColor: 'transparent', opacity: '0.45' }
          "
        >
          <img class="" [src]="tab.imageUrl" [alt]="tab.label" />
          {{ tab.label }}
        </button>
      }
    </div>
    <div class="w-full h-px bg-white/20"></div>
  </div>

  @if(activeTab === 'passkey'){
    <app-passkeys></app-passkeys>
  }
</div>
