<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="dialog-box"
>
  <!--Modal Styling-->
  <div class="relative custom-modal gradient-border gradient-border--light">
    <!-- HEADER -->
    <div class="flex flex-col items-center gap-2! mb-4!">
      <img src="images/exams/exam-rules.svg" alt="exam-rules">
      <h2 class="font-semibold text-center text-2xl text-(--color-text)">
        Examination Rules & Conduct
    </h2>
    <span class="font-normal text-center text-sm text-(--color-text)">
        You will be asked to confirm these before the exam starts
    </span>

    <button
        type="button"
        (click)="closeModal()"
        class="absolute top-6 right-6 w-8 h-8 rounded-full flex items-center justify-center bg-(--color-text)/80 border-none cursor-pointer hover:-translate-y-0.5 transition-all duration-300"
      >
        <img class="" src="images/icons/cross.svg" alt="cross" />
      </button>
    </div>

    <!-- BODY -->
    <div class="overflow-y-auto flex-1 px-4!">
      @for (rule of rules; track rule.id) {
        <div class="rules flex justify-between items-center gap-3 border-b py-2 my-1">

          <!--Number-->
          <div class="h-11 w-11 flex justify-center items-center bg-[rgba(78,52,46,0.25)] py-2 px-4 rounded-md text-base text-(--color-primary) font-semibold shrink-0">{{rule.id}}</div>
          <!--title/description-->
          <div class="title-desc flex flex-col justify-between gap-0.5">
            <h3 class="font-semibold text-start text-sm text-(--color-text)">{{rule.title}}</h3>
          <span class="font-normal text-start text-xs text-(--color-text)">{{rule.description}}</span>
          </div>
        </div>
      }
    </div>

    <!-- FOOTER -->
    <div class="flex flex-col justify-between gap-3! mt-10!">
      <!--Buttons-->
      <button class="h-10! btn btn__glass" (click)="startExam()" >Start Examination</button>
    </div>
  </div>
</p-dialog>
