<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="dialog-box"
>
  <div class="relative custom-modal gradient-border gradient-border--light">
    <!-- HEADER -->
    <div class="flex flex-col items-center gap-2! mb-4!">
      <img src="images/exams/exam-rules.svg" alt="exam-rules" />
      <h2 class="font-semibold text-center text-2xl text-(--color-text)">
        Frequently Asked Questions
      </h2>
      <span class="font-normal text-center text-sm text-(--color-text)">
        Everything you need to know about the examination process and rules. Can't find the answer
        you're looking for?
      </span>
      <button
        type="button"
        (click)="closeModal()"
        class="absolute top-6 right-6 w-8 h-8 rounded-full flex items-center justify-center bg-(--color-text)/80 border-none cursor-pointer hover:-translate-y-0.5 transition-all duration-300"
      >
        <img src="images/icons/cross.svg" alt="cross" />
      </button>
    </div>

    <!-- BODY -->
    <div class="overflow-y-auto flex-1 px-4!">
      @for (faq of faqs; track faq.id) {
        <div class="border-b py-2 my-1">
          <!-- Row -->
          <div
            class="rules flex justify-between items-center gap-3 cursor-pointer"
            (click)="toggleFaq(faq.id)"
          >
            <!-- Number -->
            <div
              class="h-11 w-11 flex justify-center items-center bg-[rgba(78,52,46,0.25)] py-2 px-4 rounded-md text-base text-(--color-primary) font-semibold shrink-0"
            >
              {{ faq.id }}
            </div>

            <!-- question -->
            <div class="flex-1">
              <h3 class="font-semibold text-start text-sm text-(--color-text)">{{ faq.question }}</h3>
            </div>

            <!-- Icon -->
            <span class="text-(--color-text) text-xl font-light shrink-0">
              {{ openFaqId === faq.id ? '−' : '+' }}
            </span>
          </div>

          <!-- Answer -->
          @if (openFaqId === faq.id) {
            <div class="pl-14">
              <span class="font-normal text-start text-xs text-(--color-text) leading-snug">{{
                faq.answer
              }}</span>
            </div>
          }
        </div>
      }
    </div>
  </div>
</p-dialog>
