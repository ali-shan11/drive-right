<div class="course-modules w-full flex flex-col px-6! py-10!">
  <!--Heading-->
  <div class="title-subtitle flex flex-col justify-between items-start gap-1">
    <div class="title flex gap-2!">
      <h2 class="font-semibold text-start text-2xl text-(--color-text)">Lagos Driving Aid</h2>
      <img src="images/greetings.svg" alt="greeting" />
    </div>
    <span class="font-normal text-start text-base text-(--color-text)"
      >Essential driving tips and rules to navigating the city.</span
    >
  </div>

  <div class="modules w-full flex flex-col justify-between items-center gap-3! py-6!">
    <!--Courser Modules-->
    <div
      *ngFor="let module of modules"
      class="relative w-full flex flex-row justify-between items-center gap-10! p-5! [background:var(--color-card-wrapper)] gradient-border gradient-border--light rounded-xl! transition-transform duration-200 hover:-translate-y-0.5"
    >
      <!--Icon & Content-->
      <div class="w-full flex items-start gap-6">
        <!-- Icon box -->
        <div
          class="shrink-0 flex items-center justify-center w-14 h-14 rounded-xl [background:var(--color-nav-bg)]"
          [innerHTML]="module.svgIcon"
        ></div>

        <!-- Title & Subtitle -->
        <div class="flex flex-col justify-between items-start gap-1!">
          <h3 class="font-semibold text-start text-lg text-(--color-text)">
            {{ module.title }}
          </h3>
          <p class="font-normal text-start text-xs text-(--color-text) mt-1!">
            {{ module.subtitle }}
          </p>
        </div>
      </div>

      <!--Progress ring and button-->
      <div class="progres-button w-full flex justify-between items-center gap-16!">
        <!-- Progress --> 
        <div class="shrink-0 self-start relative w-18 h-18">
          <round-progress
            [current]="module.currentProgress"
            [max]="100"
            [color]="'var(--color-primary)'"
            [background]="'rgba(255,255,255,0.15)'"
            [radius]="36"
            [stroke]="6"
            [semicircle]="false"
            [rounded]="true"
            [clockwise]="true"
            [duration]="800"
            [animation]="'easeInOutQuart'"
            class="block w-full h-full"
          />
          <span
            class="absolute inset-0 flex items-center justify-center text-[10px] font-medium text-white leading-none"
          >
            {{ module.currentProgress }}%
          </span>
        </div>
        <!-- Button -->
        <button
          class="btn btn__light transition-colors duration-150 cursor-pointer shadow-none! rounded-md!"
        >
          {{ module.buttonLabel }}
        </button>
      </div>
    </div>
  </div>
</div>
