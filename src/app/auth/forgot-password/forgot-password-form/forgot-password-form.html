<div class="forgot-password relative min-h-full flex flex-col justify-start px-5! pb-3.5! pt-18!">
  <!-- Logo -->
  <div class="seal absolute top-1 right-5">
    <img
      class="leading-0"
      ngSrc="/lasg-logo.png"
      width="90"
      height="90"
      alt="Lagos State Government"
      priority
    />
  </div>

  <!-- Content -->
  <div class="flex flex-col items-center gap-6">
    <!--forgot  image-->
    <div
      class="w-45 h-45 bg-(image:--forgot-password-image) bg-contain bg-center bg-no-repeat"
    ></div>

    <!-- Title / Subtitle -->
    <div class="flex flex-col gap-2">
      <h2 class="text-2xl font-semibold text-center text-(--color-text)">Forgot Password</h2>
      <span class="text-xs font-normal text-center text-(--color-text)">
        Enter your email address and we'll send you a link to reset your password
      </span>
    </div>

    <!-- Form -->
    <form class="w-full flex flex-col gap-4" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <!-- Email -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-(--color-text)" for="email">Email Address</label>
        <div class="field__control gradient-border">
          <input
            class="field__input w-full"
            id="email"
            type="email"
            formControlName="email"
            placeholder="example@gmail.com"
            autocomplete="email"
          />
          @if (emailValid) {
            <span class="field__addon field__addon--ok">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <circle cx="9" cy="9" r="9" fill="var(--color-primary)" />
                <path
                  d="M5 9.2L7.6 12L13 6"
                  stroke="#fff"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          }
        </div>
      </div>

      <!--Buttons-->
      <div class="buttons w-full flex flex-col justify-between items-center gap-4">
        <div class="gradient-border gradient-border--light w-full">
          <button class="btn btn__light" type="submit">Continue</button>
        </div>

        <div (click)="back.emit()" class="gradient-border gradient-border--dark w-full">
          <button class="btn btn__dark">Back</button>
        </div>
      </div>

    </form>
  </div>
</div>
