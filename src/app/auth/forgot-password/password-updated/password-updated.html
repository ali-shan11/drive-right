<div class="forgot-password relative min-h-full flex flex-col justify-start px-5! pb-3.5! pt-18!">
  <!-- Logo -->
  <div class="seal absolute top-1 right-5">
    <img
      class="leading-0"
      ngSrc="/lasg-logo.png"
      width="90"
      height="90"
      alt="Lagos State Government"
      priority
    />
  </div>

  <!-- Content -->
  <div class="flex flex-col items-center gap-6">
    <!-- updated image-->
    <div
      class="w-45 h-45 bg-(image:--password-updated-image) bg-contain bg-center bg-no-repeat"
    ></div>

    <!-- Title / Subtitle -->
    <div class="flex flex-col gap-2">
      <h2 class="text-2xl font-semibold text-center text-(--color-text)">Password Updated</h2>
      <span class="text-xs font-normal text-center text-(--color-text)">
        You’ve successfully updated your Password. For security reasons, ensure you keep it safe and
        do not share it with anyone.
      </span>
    </div>

    <!--Button-->
    <div (click)="next.emit()" class="gradient-border gradient-border--light w-full">
      <button class="btn btn__light">Login</button>
    </div>

  </div>
</div>
