<div class="forgot-password relative min-h-full flex flex-col justify-start px-5! pb-3.5! pt-18!">
  <!-- Logo -->
  <div class="seal absolute top-1 right-5">
    <img
      class="leading-0"
      ngSrc="/lasg-logo.png"
      width="90"
      height="90"
      alt="Lagos State Government"
      priority
    />
  </div>

  <!-- Content -->
  <div class="flex flex-col items-center gap-6">
    <!--forgot  image-->
    <div
      class="w-45 h-45 bg-(image:--forgot-password-image) bg-contain bg-center bg-no-repeat"
    ></div>

    <!-- Title / Subtitle -->
    <div class="flex flex-col gap-2">
      <h2 class="text-2xl font-semibold text-center text-(--color-text)">Set New Password</h2>
      <span class="text-xs font-normal text-center text-(--color-text)">
        Secure your account with a new password.
      </span>
    </div>

    <!-- Form -->
    <form class="w-full flex flex-col gap-4" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <!-- Password -->
      <div class="field">
        <label class="field__label" for="password">Password</label>
        <div class="field__control gradient-border">
          <input
            class="field__input"
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="field__addon field__addon--btn"
            (click)="togglePassword()"
            tabindex="-1"
          >
            @if (showPassword()) {
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path
                  d="M2 9s2.8-5 7-5 7 5 7 5-2.8 5-7 5-7-5-7-5z"
                  stroke="rgba(241,245,249,0.5)"
                  stroke-width="1.5"
                  stroke-linejoin="round"
                />
                <circle cx="9" cy="9" r="2.2" stroke="rgba(241,245,249,0.5)" stroke-width="1.5" />
                <path
                  d="M2 2l14 14"
                  stroke="rgba(241,245,249,0.5)"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path
                  d="M2 9s2.8-5 7-5 7 5 7 5-2.8 5-7 5-7-5-7-5z"
                  stroke="rgba(241,245,249,0.5)"
                  stroke-width="1.5"
                  stroke-linejoin="round"
                />
                <circle cx="9" cy="9" r="2.2" stroke="rgba(241,245,249,0.5)" stroke-width="1.5" />
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="field">
        <label class="field__label" for="confirmPassword">Confirm Password</label>
        <div class="field__control gradient-border">
          <input
            class="field__input"
            [class.field__input--err]="passwordsMismatch"
            id="confirmPassword"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="••••••••"
            autocomplete="new-password"
          />
          @if (passwordsMismatch) {
            <span class="field__addon field__addon--err">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <circle cx="9" cy="9" r="9" fill="#ef4444" />
                <path
                  d="M6 6l6 6M12 6l-6 6"
                  stroke="#fff"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </span>
          } @else {
            <button
              type="button"
              class="field__addon field__addon--btn"
              (click)="toggleConfirmPassword()"
              tabindex="-1"
            >
              @if (showConfirmPassword()) {
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path
                    d="M2 9s2.8-5 7-5 7 5 7 5-2.8 5-7 5-7-5-7-5z"
                    stroke="rgba(241,245,249,0.5)"
                    stroke-width="1.5"
                    stroke-linejoin="round"
                  />
                  <circle cx="9" cy="9" r="2.2" stroke="rgba(241,245,249,0.5)" stroke-width="1.5" />
                  <path
                    d="M2 2l14 14"
                    stroke="rgba(241,245,249,0.5)"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                </svg>
              } @else {
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path
                    d="M2 9s2.8-5 7-5 7 5 7 5-2.8 5-7 5-7-5-7-5z"
                    stroke="rgba(241,245,249,0.5)"
                    stroke-width="1.5"
                    stroke-linejoin="round"
                  />
                  <circle cx="9" cy="9" r="2.2" stroke="rgba(241,245,249,0.5)" stroke-width="1.5" />
                </svg>
              }
            </button>
          }
        </div>
      </div>
      
      <!--Buttons-->
      <div class="buttons w-full flex flex-col justify-between items-center gap-4">
        <div class="gradient-border gradient-border--light w-full">
          <button class="btn btn__light" type="submit" [disabled]="loading()">Continue</button>
        </div>

        <div class="gradient-border gradient-border--dark w-full">
          <button class="btn btn__dark" type="button" [disabled]="loading()" (click)="back.emit()">Back</button>
        </div>
      </div>
    </form>
  </div>
</div>
