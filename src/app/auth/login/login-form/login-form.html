<div class="form-panel__body">
  <div class="form-panel__head">
    <div class="seal mb-3">
      <img ngSrc="/lasg-logo.png" width="90" height="90" alt="Lagos State Government" priority />
    </div>
    <h2 class="form-panel__title mt-2">Welcome Back</h2>
    <p class="form-panel__subtitle">
      Continue your progress towards mastery, Your driver’s license awaits you..
    </p>
  </div>

  <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <!-- Username or Email Address -->
    <div class="field">
      <label class="field__label" for="userName">Username or Email Address</label>
      <div class="field__control gradient-border">
        <input
          class="field__input"
          id="userName"
          type="text"
          formControlName="userNameOrEmailAddress"
          placeholder="Username or Email"
          autocomplete="username"
        />
        @if (userNameValid) {
          <span class="field__addon field__addon--ok">
            <!-- green circle-check -->
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <circle cx="9" cy="9" r="9" fill="var(--color-primary)" />
              <path
                d="M5 9.2L7.6 12L13 6"
                stroke="#fff"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        }
      </div>
    </div>

    <!-- Password -->
    <div class="field">
      <label class="field__label" for="password">Password</label>
      <div class="field__control gradient-border">
        <input
          class="field__input"
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="field__addon field__addon--btn"
          (click)="togglePassword()"
          tabindex="-1"
        >
          @if (showPassword()) {
            <!-- eye-off -->
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path
                d="M2 9s2.8-5 7-5 7 5 7 5-2.8 5-7 5-7-5-7-5z"
                stroke="rgba(241,245,249,0.5)"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
              <circle cx="9" cy="9" r="2.2" stroke="rgba(241,245,249,0.5)" stroke-width="1.5" />
              <path
                d="M2 2l14 14"
                stroke="rgba(241,245,249,0.5)"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          } @else {
            <!-- eye -->
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path
                d="M2 9s2.8-5 7-5 7 5 7 5-2.8 5-7 5-7-5-7-5z"
                stroke="rgba(241,245,249,0.5)"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
              <circle cx="9" cy="9" r="2.2" stroke="rgba(241,245,249,0.5)" stroke-width="1.5" />
            </svg>
          }
        </button>
      </div>
    </div>

    <!-- ── Buttons ── -->
    <div class="form__actions">
      <div class="gradient-border gradient-border--light w-full">
        <button
          (click)="onSubmit()"
          type="button"
          class="btn btn__light flex items-center justify-center gap-2"
          [disabled]="form.invalid || isLoading()"
        >
          @if (isLoading()) {
            <div class="spinner"></div>
          }
          Login
        </button>
      </div>

      <!--Or Div-->
      <div class="flex items-center gap-3 my-4">
        <div class="flex-1 h-px bg-(--color-text)"></div>
        <span class="text-(--color-text) text-base font-normal tracking-widest">or</span>
        <div class="flex-1 h-px bg-(--color-text)"></div>
      </div>

      <div class="gradient-border gradient-border--dark w-full">
        <button type="button" class="btn btn__dark">
          <!-- Google G -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            />
          </svg>
          Continue with Google
        </button>
      </div>
    </div>
  </form>

  <p class="signin-prompt flex justify-center items-center gap-0.5 mt-4!">
    <span class="text-sm text-center text-(--color-text)">Don't have an account?</span>
    <a
      class="signin-prompt__link text-sm text-center text-(--color-primary) hover:underline"
      routerLink="/sign-up"
      >Sign up</a
    >
  </p>
</div>
