<div class="grid grid-cols-[350px_1fr] items-stretch gap-3 p-4">
  <!-- Sidebar -->
  <div
    class="side-bar bg-(--color-card-wrapper) gradient-border gradient-border--light p-3 flex flex-col gap-2"
  >
    <!--heading-->
    <div class="sidebar-heading [background:var(--color-input-bg)] rounded-full py-1 px-5">
      <h2 class="sidebar-heading__text text-start text-lg text-(--color-text) font-semibold">
        Table of Content
      </h2>
    </div>

    <!--Chapters Name-->
    <div
      class="chapters-name w-full h-full bg-(--color-card-wrapper) gradient-border gradient-border--light p-3"
    >
      <div class="chapters__buttons flex flex-col justify-between gap-2">
        <button (click)="currentChapter.set(1)" class="btn" [class]="currentChapter() === 1 ? 'btn__dark' : 'btn__glass'">Chapter 1: (Theory)</button>
        <button (click)="currentChapter.set(2)" class="btn" [class]="currentChapter() === 2 ? 'btn__dark' : 'btn__glass'">Chapter 2: (Vedio)</button>
        <button (click)="currentChapter.set(3)" class="btn" [class]="currentChapter() === 3 ? 'btn__dark' : 'btn__glass'">
          Chapter 3: Interactive Session
        </button>
        <button (click)="currentChapter.set(4)" class="btn" [class]="currentChapter() === 4 ? 'btn__dark' : 'btn__glass'">
          Chapter 4: VR Simulation
        </button>
      </div>
    </div>
  </div>

  <!-- Chapter Details -->
  <div class="chapter-details flex-1 p-1 overflow-y-auto">
    <!--Chapter Header-->
    <div class="flex justify-between items-center gap-2 pb-2 border-b border-(--color-text)/70">
      <!--Heading -->
      <div class="heading flex flex-row items-center gap-2">
        <h2 class="text-center text-xl text-(--color-text) font-semibold">Interactive Session</h2>
        <!--course count-->
        <div
          class="flex flex-row justify-between items-center gap-1 py-0.5 px-2 bg-[rgba(170,183,191,0.25)] rounded-full mt-2"
        >
          <img src="images/icons/coursecount.svg" alt="coursecount" />
          <span class="text-center text-xs text-(--color-text) font-normal">12 Exercise</span>
        </div>
      </div>
      <!--Button-->
      <div class="buttons flex flex-row justify-between items-center gap-4">
        <button
          class="w-45! btn btn__glass flex flex-row justify-center items-center gap-1 rounded-full!"
        >
          <img src="images/icons/bookmarkyellow.svg" alt="bookmarkyellow" />Bookmark Chapter
        </button>
        <button
          class="w-max! btn btn__glass flex flex-row justify-center items-center gap-1 rounded-full!"
        >
          <img src="images/icons/takenotes.svg" alt="take notes" />Take Notes
        </button>
      </div>
    </div>

    <!--Chapter Comps-->
    <div class="chapters-comps mt-3">
      @switch (currentChapter()) {
        @case (1) {
          <app-theory-chapter />
        }
        @case (2) {
          <app-video-chapter />
        }
        @case (3) {
          <app-interactive-session-chapter />
        }
        @case (4) {
          <app-vr-simulation-chapter />
        }
      }
    </div>
  </div>
</div>
