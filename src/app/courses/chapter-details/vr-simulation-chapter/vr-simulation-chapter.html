<div class="video-chap flex flex-col gap-3">
  <!--Vedio-->
  <div
    class="relative flex items-center justify-center video max-h-120 h-full w-full gradient-border gradient-border--light aspect-video rounded-md!"
  >
    <img class="w-full h-full object-cover rounded-md" src="images/vrsimulation.png" alt="" />

    <div class="absolute flex flex-col justify-between gap-2">
      <!--Heading -->
      <div class="heading">
        <h2 class="text-center text-xl text-(--color-text) font-semibold">
          Lagos T-Junction VR Simulation
        </h2>
      </div>
      <!--subTitle-->
      <span class="text-center text-base text-(--color-text) font-normal">
        Lagos T-Junction VR Simulation
      </span>
      <!--Button-->
      <button (click)="startSimulation()" class="w-34! btn btn__glass self-center">Start Simulation</button>
    </div>

  </div>
</div>
