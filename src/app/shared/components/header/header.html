<!--Main Header-->
<header class="header w-full px-5! py-2! flex flex-row items-center justify-between! relative">
  <!--Logo Image-->
  <div class="logo flex justify-between items-center gap-2!">
    <img
      class="logo__img"
      ngSrc="/lasg-logo.png"
      width="28"
      height="28"
      alt="DriveRight Lagos"
      priority
    />
    <span class="logo__text color(--color-text) text-lg">DriveRight Lagos</span>
  </div>

  <!--Nav Items-->
  <nav
    class="nav-bar flex flex-row items-center gap-3 p-6! absolute! left-1/2! -translate-x-1/2! rounded-b-2xl! gradient-border gradient-border--light gradient-border--no-top shadow-xl!"
  >
    <a
      href="#"
      class="nav-item flex items-center gap-2 px-3! py-1! rounded-lg bg-[rgba(131,131,131,0.11)] border border-[rgba(179,88,232,0.07)] text-(--color-text) text-xs font-medium whitespace-nowrap overflow-hidden hover:-translate-y-0.5 transition-all duration-300"
    >
      <img class="w-4! h-4! shrink-0!" src="" alt="dashboard" />
      Dashboard
    </a>
    <a
      href="#"
      class="nav-item flex items-center gap-2 px-3! py-1! rounded-lg bg-[rgba(131,131,131,0.11)] border border-[rgba(179,88,232,0.07)] text-(--color-text) text-xs font-medium whitespace-nowrap overflow-hidden hover:-translate-y-0.5 transition-all duration-300"
    >
      <img class="w-4! h-4! shrink-0!" src="images/courses.svg" alt="courses" />
      Courses
    </a>
    <a
      href="#"
      class="nav-item flex items-center gap-2 px-3! py-1! rounded-lg bg-[rgba(131,131,131,0.11)] border border-[rgba(179,88,232,0.07)] text-(--color-text) text-xs font-medium whitespace-nowrap overflow-hidden hover:-translate-y-0.5 transition-all duration-300"
    >
      <img class="w-4! h-4! shrink-0!" src="images/mocktest.svg" alt="mocktest" />
      Mock Test
    </a>
    <a
      href="#"
      class="nav-item flex items-center gap-2 px-3! py-1! rounded-lg bg-[rgba(131,131,131,0.11)] border border-[rgba(179,88,232,0.07)] text-(--color-text) text-xs font-medium whitespace-nowrap overflow-hidden hover:-translate-y-0.5 transition-all duration-300"
    >
      <img class="w-4! h-4! shrink-0!" src="images/exams.svg" alt="exams" />
      Official Exam
    </a>
    <a
      href="#"
      class="nav-item flex items-center gap-2 px-3! py-1! rounded-lg bg-[rgba(131,131,131,0.11)] border border-[rgba(179,88,232,0.07)] text-(--color-text) text-xs font-medium whitespace-nowrap overflow-hidden hover:-translate-y-0.5 transition-all duration-300"
    >
      <img class="w-4! h-4! shrink-0!" src="images/credentials.svg" alt="credentials" />
      Credentials
    </a>
    <a
      href="#"
      class="nav-item flex items-center gap-2 px-3! py-1! rounded-lg bg-[rgba(131,131,131,0.11)] border border-[rgba(179,88,232,0.07)] text-(--color-text) text-xs font-medium whitespace-nowrap overflow-hidden hover:-translate-y-0.5 transition-all duration-300"
    >
      <img class="w-4! h-4! shrink-0!" src="images/drive.svg" alt="drive" />
      Physical Enrollment
    </a>
  </nav>

  <!--Profile & Notifications-->
  <div class="profile-notifications flex flex-row justify-between items-center gap-3">
    <img class="w-7 h-7" src="images/notification.svg" alt="notifications" />

    <div
      class="profile-image w-10 h-10 rounded-full overflow-hidden! p-0!"
    >
      <img class="w-full! h-full! object-cover! block!" src="images/profile.png" alt="profile" />
    </div>
  </div>
</header>
